name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Core ML (and the Metal GPU backend) only exist on macOS; those tests skip themselves on Linux.
      # PyTorch comes from the CPU-only index so the runner doesn't download GPU libraries.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[mlir,onnx,torch,dev]'

      - name: Test
        run: python -m pytest -q
